<style>
  /* Une scène 3D au centre, la légende du modèle choisi dessous. */
  :root {
    --bg: #F3F4F1; --surface: #FFFFFF; --fg: #18241F; --muted: #4A5852; --line: #D5DAD3;
    --accent: #2B3A6E; --accent-fg: #FFFFFF;
    --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121A17; --surface: #1A2420; --fg: #E7ECE8; --muted: #A9B5AF; --line: #33403A; --accent: #9FB0EA; --accent-fg: #121A17; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #121A17; --surface: #1A2420; --fg: #E7ECE8; --muted: #A9B5AF; --line: #33403A; --accent: #9FB0EA; --accent-fg: #121A17; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.5; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
  .brand { margin: 0; font-weight: 700; color: var(--accent); letter-spacing: 0.04em; }
  .brand a { color: var(--accent); text-decoration: none; }
  .brand a:hover, .brand a:focus-visible { text-decoration: underline; }
  h1 { margin: 2px 0 0; font-size: clamp(1.7rem, 4vw, 2.6rem); line-height: 1.1; text-wrap: balance; }
  .switch { display: inline-flex; border: 2px solid var(--accent); border-radius: 999px; padding: 3px; gap: 3px; }
  .switch button { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 10px 20px; min-height: 44px; background: transparent; color: var(--accent); cursor: pointer; }
  .switch button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
  .switch button:focus-visible, .tools button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .stage { position: relative; width: 100%; aspect-ratio: 16 / 10; max-height: 74vh; max-width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; touch-action: none; }
  .stage canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  .stage canvas:active { cursor: grabbing; }
  .tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; }
  .tools button { font: inherit; font-size: 14px; font-weight: 700; min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
  .hint { position: absolute; right: 14px; bottom: 16px; margin: 0; font-size: 13px; color: var(--muted); }
  .nogl { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

  .legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 28px; margin: 0; padding: 0; list-style: none; }
  .legend li { min-width: 0; }
  .legend strong { display: block; }
  .legend span { color: var(--muted); font-size: 15px; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px 28px; margin: 0; color: var(--muted); font-size: 15px; }
  .meta b { color: var(--fg); }
  @media (max-width: 560px) { .hint { display: none; } }
</style>

<div class="wrap">
  <header>
    <div>
      <p class="brand"><a href="./" style="color: inherit; text-decoration: none">BAGUÉ</a> · <a href="./">Accueil</a> · <a href="demo.html">Démo *123#</a></p>
      <h1 id="title">Le poste fixe</h1>
    </div>
    <div class="switch" role="group" aria-label="Choisir le matériel">
      <button type="button" id="btn-poste" aria-pressed="true">Poste fixe</button>
      <button type="button" id="btn-kit" aria-pressed="false">Kit de terrain</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <div class="tools">
      <button type="button" id="view-34">Vue 3/4</button>
      <button type="button" id="view-front">Face</button>
      <button type="button" id="view-back">Dos</button>

    <p class="hint">Glissez pour tourner, pincez pour zoomer</p>
  </div>

  <p class="meta" id="meta"></p>
  <ul class="legend" id="legend"></ul>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
(() => {
  const INFO = {
    poste: {
      title: "Le poste fixe",
      meta: "<span><b>Où</b> : sous-préfecture, marché, abattoir</span><span><b>Énergie</b> : solaire 200 W + LiFePO4 100 Ah</span><span><b>Prix estimé</b> : 920 à 1 520 USD</span>",
      items: [
        ["Panneau solaire 200 W", "Alimente le poste et fait de l'ombre à l'écran."],
        ["Antenne 4G double SIM", "Si un opérateur coupe, l'autre prend le relais."],
        ["Écran tactile 7\" sous visière", "Gros boutons en français, lisible au soleil."],
        ["Imprimante thermique", "Cartes des animaux et certificats de voyage."],
        ["Caméra sur perche avec cône", "Photo du mufle de l'animal au pied du poste."],
        ["Station de recharge", "Quatre kits rechargés et mis à jour chaque matin."],
        ["Coffre fermé à clé", "Ordinateur CM5, routeur et batterie, ventilés."],
        ["Pied scellé dans le béton", "Le poste ne s'emporte pas."],
      ],
    },
    kit: {
      title: "Le kit de terrain",
      meta: "<span><b>Usage</b> : enregistrer et contrôler</span><span><b>Cerveau</b> : Raspberry Pi CM5 4 Go, écran 7 pouces</span><span><b>Prototype</b> : environ 400 USD</span>",
      items: [
        ["Cône noir mat aimanté", "Bloque le soleil, garde la même distance pour chaque photo. Trois longueurs, bord en caoutchouc."],
        ["Anneau de LED", "Même lumière à midi comme le soir, intensité réglable."],
        ["Écran tactile 7\"", "Affiche VERT, ROUGE, ORANGE ou GRIS en grand, lisible au soleil."],
        ["Deux poignées", "Le kit se tient à deux mains, cône bien appuyé sur le mufle."],
        ["Bouton Photo", "Sous le pouce droit : la photo se prend sans lâcher les poignées."],
        ["Batterie 20 000 mAh", "Dans le berceau sous l'écran, échangée en une minute."],
        ["Antenne Wi-Fi", "Envoie les contrôles dès qu'un réseau est disponible."],
      ],
    },
  };

  const stage = document.getElementById("stage");
  const hasGL = (() => {
    try { const c = document.createElement("canvas"); return !!(window.WebGLRenderingContext && (c.getContext("webgl") || c.getContext("experimental-webgl"))); }
    catch (e) { return false; }
  })();

  function renderInfo(name) {
    const info = INFO[name];
    document.getElementById("title").textContent = info.title;
    document.getElementById("meta").innerHTML = info.meta;
    const list = document.getElementById("legend");
    list.replaceChildren();
    for (const [head, text] of info.items) {
      const li = document.createElement("li");
      const strong = document.createElement("strong");
      strong.textContent = head;
      const span = document.createElement("span");
      span.textContent = text;
      li.append(strong, span);
      list.append(li);
    }
    document.getElementById("btn-poste").setAttribute("aria-pressed", String(name === "poste"));
    document.getElementById("btn-kit").setAttribute("aria-pressed", String(name === "kit"));
  }

  if (!hasGL || !window.THREE) {
    const msg = document.createElement("div");
    msg.className = "nogl";
    msg.textContent = "Cet appareil n'affiche pas la 3D. Les images du poste et du kit restent disponibles dans la conversation.";
    stage.append(msg);
    renderInfo("poste");
    document.getElementById("btn-poste").addEventListener("click", () => renderInfo("poste"));
    document.getElementById("btn-kit").addEventListener("click", () => renderInfo("kit"));
    return;
  }

  // ---------- Matières ----------
  const C = { light: 0xECEDE8, dark: 0x2E3436, black: 0x141616, indigo: 0x2B3A6E, metal: 0x9AA39D, metalDark: 0x6F7A75, concrete: 0xC8CCC4, panel: 0xDADDD6 };
  const srgb = (hex) => new THREE.Color(hex).convertSRGBToLinear();
  const mat = (color, rough = 0.6, metal = 0) => new THREE.MeshStandardMaterial({ color: srgb(color), roughness: rough, metalness: metal });
  const M = {
    light: mat(C.light, 0.55), dark: mat(C.dark, 0.7), black: mat(C.black, 0.9), indigo: mat(C.indigo, 0.5),
    metal: mat(C.metal, 0.45, 0.5), metalDark: mat(C.metalDark, 0.5, 0.4), concrete: mat(C.concrete, 0.95), panel: mat(C.panel, 0.6),
    door: mat(0xE3E5DF, 0.55), louver: mat(0x8E978F, 0.6), lens: mat(0x3A5A8A, 0.2, 0.3), paper: mat(0xFFFFFF, 0.8),
  };
  const glow = (color) => new THREE.MeshStandardMaterial({ color: srgb(color), emissive: srgb(color), emissiveIntensity: 0.9, roughness: 0.4 });

  // ---------- Textures dessinées ----------
  function canvasTexture(w, h, draw) {
    const cv = document.createElement("canvas");
    cv.width = w; cv.height = h;
    draw(cv.getContext("2d"), w, h);
    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = 4;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }
  const FONT = "700 {s}px 'Atkinson Hyperlegible Next', 'Segoe UI', Arial, sans-serif";
  const screenTex = canvasTexture(512, 320, (g, w, h) => {
    g.fillStyle = "#FBFCFA"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#1E7F47"; g.fillRect(0, 0, w, 92);
    g.fillStyle = "#FFFFFF"; g.font = FONT.replace("{s}", 48); g.fillText("Conforme", 26, 64);
    const rows = [[120, 210], [120, 170], [120, 240]];
    rows.forEach(([a, b], i) => {
      g.fillStyle = "#C2C9C1"; g.fillRect(26, 120 + i * 36, a, 14);
      g.fillStyle = "#4A5852"; g.fillRect(170, 120 + i * 36, b, 14);
    });
    g.fillStyle = "#2B3A6E"; g.fillRect(26, 244, 210, 50);
  });
  const brandTex = canvasTexture(512, 64, (g, w, h) => {
    g.fillStyle = "#2B3A6E"; g.fillRect(0, 0, w, h);
    g.fillStyle = "#FFFFFF"; g.font = FONT.replace("{s}", 40); g.textAlign = "center"; g.fillText("B A G U É", w / 2, 47);
  });
  const sideTex = canvasTexture(512, 160, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    g.fillStyle = "#2B3A6E"; g.font = FONT.replace("{s}", 96); g.textAlign = "center"; g.fillText("BAGUÉ", w / 2, 112);
  });
  const solarTex = canvasTexture(512, 320, (g, w, h) => {
    g.fillStyle = "#1A2850"; g.fillRect(0, 0, w, h);
    const cols = 10, rows = 6;
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++) {
      g.fillStyle = (i + j) % 2 ? "#22336A" : "#1E2E60";
      g.fillRect(i * (w / cols) + 3, j * (h / rows) + 3, w / cols - 6, h / rows - 6);
    }
  });

  // ---------- Formes ----------
  function add(group, geometry, material, x = 0, y = 0, z = 0) {
    const mesh = new THREE.Mesh(geometry, material);
    mesh.position.set(x, y, z);
    mesh.castShadow = true; mesh.receiveShadow = true;
    group.add(mesh);
    return mesh;
  }
  const box = (g, w, h, d, m, x, y, z) => add(g, new THREE.BoxGeometry(w, h, d), m, x, y, z);
  function roundedShape(w, h, r) {
    const s = new THREE.Shape();
    const x = -w / 2, y = -h / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function extrude(g, shape, depth, bevel, m, x, y, z) {
    const geo = new THREE.ExtrudeGeometry(shape, { depth: depth - 2 * bevel, bevelEnabled: true, bevelSize: bevel, bevelThickness: bevel, bevelSegments: 4, curveSegments: 10 });
    geo.translate(0, 0, -(depth - 2 * bevel) / 2);
    return add(g, geo, m, x, y, z);
  }
  const roundedBox = (g, w, h, d, r, m, x, y, z) => extrude(g, roundedShape(w - 2 * r * 0.5, h - 2 * r * 0.5, r), d, r * 0.5, m, x, y, z);
  function plane(g, w, h, map, x, y, z, transparent = false) {
    const m = new THREE.MeshBasicMaterial({ map, transparent, toneMapped: false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m);
    mesh.position.set(x, y, z);
    g.add(mesh);
    return mesh;
  }
  const cyl = (g, rt, rb, h, m, x, y, z, seg = 32, open = false) => add(g, new THREE.CylinderGeometry(rt, rb, h, seg, 1, open), m, x, y, z);

  // ---------- Le poste fixe ----------
  function buildPoste() {
    const g = new THREE.Group();
    box(g, 1.0, 0.08, 0.7, M.concrete, 0, 0.04, 0);
    box(g, 0.5, 0.03, 0.36, M.metalDark, 0, 0.095, 0);
    box(g, 0.16, 0.76, 0.12, M.metal, 0, 0.49, 0);
    roundedBox(g, 0.9, 1.3, 0.36, 0.05, M.light, 0, 1.52, 0);
    const front = 0.18;

    box(g, 0.72, 0.075, 0.012, M.indigo, 0, 2.085, front + 0.006);
    plane(g, 0.7, 0.07, brandTex, 0, 2.085, front + 0.0125);
    const cam = cyl(g, 0.028, 0.028, 0.03, M.dark, 0, 2.0, front + 0.015); cam.rotation.x = Math.PI / 2;
    const lens = cyl(g, 0.014, 0.014, 0.01, M.lens, 0, 2.0, front + 0.032); lens.rotation.x = Math.PI / 2;
    box(g, 0.74, 0.018, 0.15, M.light, 0, 1.94, front + 0.07);
    box(g, 0.66, 0.42, 0.024, M.dark, 0, 1.715, front + 0.012);
    plane(g, 0.6, 0.36, screenTex, 0, 1.715, front + 0.0255);

    [[-0.3, 0x1E7F47], [-0.27, 0x1E7F47], [-0.24, 0xC77700]].forEach(([x, c]) => add(g, new THREE.SphereGeometry(0.008, 12, 12), glow(c), x, 1.465, front + 0.004));
    box(g, 0.22, 0.02, 0.02, M.dark, 0.17, 1.465, front + 0.01);
    const paper = add(g, new THREE.PlaneGeometry(0.18, 0.07), M.paper, 0.17, 1.425, front + 0.03);
    paper.rotation.x = -0.35;

    box(g, 0.76, 0.27, 0.012, M.panel, 0, 1.255, front + 0.006);
    [-0.27, -0.09, 0.09, 0.27].forEach((x, i) => {
      box(g, 0.15, 0.2, 0.016, M.dark, x, 1.265, front + 0.012);
      if (i < 3) {
        roundedBox(g, 0.07, 0.15, 0.07, 0.016, M.light, x, 1.29, front + 0.035);
        box(g, 0.012, 0.15, 0.002, M.indigo, x - 0.0, 1.29, front + 0.0715);
      }
      add(g, new THREE.SphereGeometry(0.007, 12, 12), glow(i < 2 ? 0x1E7F47 : i === 2 ? 0xC77700 : 0x8E978F), x, 1.145, front + 0.014);
    });

    roundedBox(g, 0.76, 0.25, 0.024, 0.012, M.door, 0, 0.99, front + 0.012);
    for (let i = 0; i < 5; i++) box(g, 0.32, 0.009, 0.01, M.louver, -0.16, 0.92 + i * 0.035, front + 0.024);
    const lock = cyl(g, 0.02, 0.02, 0.012, M.metalDark, 0.3, 0.99, front + 0.024); lock.rotation.x = Math.PI / 2;

    const solar = new THREE.Group();
    box(solar, 1.42, 0.035, 0.86, M.metal, 0, 0, 0);
    const cells = plane(solar, 1.36, 0.8, solarTex, 0, 0.0185, 0);
    cells.rotation.x = -Math.PI / 2;
    solar.position.set(0, 2.42, 0);
    solar.rotation.x = 0.22;
    solar.traverse((o) => { if (o.isMesh) o.castShadow = true; });
    g.add(solar);
    [[-0.34, 0.12], [0.34, 0.12], [-0.34, -0.12], [0.34, -0.12]].forEach(([x, z]) => {
      const top = 2.42 - z * Math.sin(0.22) - 0.02;
      cyl(g, 0.014, 0.014, top - 2.17, M.metalDark, x, (top + 2.17) / 2, z, 12);
    });

    box(g, 0.03, 0.04, 0.04, M.metalDark, 0.465, 2.0, -0.08);
    cyl(g, 0.008, 0.01, 0.26, M.dark, 0.48, 2.15, -0.08, 12);

    box(g, 0.03, 0.08, 0.05, M.metalDark, -0.465, 1.66, 0.06);
    cyl(g, 0.03, 0.03, 0.22, M.dark, -0.51, 1.6, 0.06);
    box(g, 0.02, 0.05, 0.03, M.indigo, -0.51, 1.66, 0.09);
    cyl(g, 0.032, 0.065, 0.1, M.black, -0.51, 1.44, 0.06, 32);
    const rim = add(g, new THREE.TorusGeometry(0.065, 0.007, 10, 40), M.black, -0.51, 1.39, 0.06); rim.rotation.x = Math.PI / 2;
    const curve = new THREE.CatmullRomCurve3([
      new THREE.Vector3(-0.51, 1.71, 0.06), new THREE.Vector3(-0.6, 1.62, 0.12), new THREE.Vector3(-0.63, 1.3, 0.14),
      new THREE.Vector3(-0.56, 1.05, 0.1), new THREE.Vector3(-0.46, 0.98, 0.04),
    ]);
    add(g, new THREE.TubeGeometry(curve, 60, 0.006, 8, false), M.dark);
    return g;
  }

  // ---------- Le kit (lecteur v2 : écran 7", deux poignées, cône aimanté) ----------
  // Dessin simplifié du prototype v2 (mêmes proportions, en mètres), pas le fichier de fabrication.
  function rrect(w, h, r, cx = 0, cy = 0) {
    const s = roundedShape(w, h, r);
    if (cx || cy) {
      const pts = s.getPoints(8).map((p) => new THREE.Vector2(p.x + cx, p.y + cy));
      return new THREE.Shape(pts);
    }
    return s;
  }
  // BAGUÉ et le nom de l'auteur, gravés en lettres simples sur la face avant du berceau.
  const drawSignature = (g, w, h) => {
    g.clearRect(0, 0, w, h);
    g.fillStyle = "#2B3A6E"; g.textAlign = "center";
    g.font = FONT.replace("{s}", 92); g.fillText("BAGUÉ", w * 0.3, 112);
    g.font = FONT.replace("{s}", 54); g.fillText("Thierno Diallo", w * 0.74, 104);
  };
  const signatureTex = canvasTexture(1024, 160, drawSignature);
  if (document.fonts && document.fonts.load) {
    document.fonts.load("700 92px 'Atkinson Hyperlegible Next'")
      .then(() => { drawSignature(signatureTex.image.getContext("2d"), 1024, 160); signatureTex.needsUpdate = true; })
      .catch(() => {});
  }

  function buildKit() {
    const g = new THREE.Group();
    const coneMat = new THREE.MeshStandardMaterial({ color: srgb(C.dark), roughness: 0.85, side: THREE.DoubleSide });
    const gold = mat(0xC9A24A, 0.35, 0.7);
    const zAxis = (mesh) => { mesh.rotation.x = Math.PI / 2; return mesh; };

    // Écran 7" dans son cadre (lèvre sur la bordure noire), boîtier CM5 derrière.
    const frame = rrect(0.2, 0.123, 0.006);
    frame.holes.push(rrect(0.185, 0.108, 0.004));
    extrude(g, frame, 0.012, 0.0015, M.light, 0, 0, -0.004);
    box(g, 0.193, 0.116, 0.008, M.black, 0, 0, -0.004);
    plane(g, 0.158, 0.094, screenTex, 0, 0, 0.0006);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => box(g, 0.014, 0.014, 0.0475, M.light, sx * 0.1039, sy * 0.0654, -0.02175));
    roundedBox(g, 0.136, 0.092, 0.0395, 0.006, M.metal, 0, 0, -0.02775);

    // Plaque dorsale ajourée (porte la tête, l'antenne et le variateur).
    const plate = rrect(0.23, 0.153, 0.008);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => plate.holes.push(rrect(0.04, 0.044, 0.006, sx * 0.083, sy * 0.04)));
    extrude(g, plate, 0.006, 0.0012, M.dark, 0, 0, -0.0545);

    // Deux poignées en C ; BAGUÉ sur le côté ; bouton photo sous le pouce droit.
    [1, -1].forEach((side) => {
      const c = new THREE.Shape([
        [0.097, 0.0724], [0.183, 0.0724], [0.183, -0.0724], [0.097, -0.0724],
        [0.097, -0.0584], [0.155, -0.0584], [0.155, 0.0584], [0.097, 0.0584],
      ].map(([x, y]) => new THREE.Vector2(side * x, y)));
      extrude(g, c, 0.032, 0.004, M.light, 0, 0, -0.0355);
      const label = plane(g, 0.09, 0.028, sideTex, side * 0.1836, 0, -0.0355, true);
      label.rotateY(side * Math.PI / 2);
      label.rotateZ(Math.PI / 2);
    });
    zAxis(cyl(g, 0.0075, 0.0075, 0.004, M.indigo, 0.169, 0.03, -0.0175, 32));

    // Berceau de la batterie sous l'écran, BAGUÉ et signature gravés devant.
    roundedBox(g, 0.19, 0.036, 0.079, 0.006, M.light, 0.0155, -0.0904, -0.0375);
    plane(g, 0.18, 0.028, signatureTex, 0.0155, -0.0904, 0.0021, true);

    // Tête caméra : platine, colonnes, collerette, anneau de LED, puis le cône aimanté.
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => zAxis(cyl(g, 0.005, 0.005, 0.015, M.dark, sx * 0.0325, sy * 0.0325, -0.065, 16)));
    zAxis(cyl(g, 0.05, 0.05, 0.005, M.indigo, 0, 0, -0.0749, 48));
    zAxis(cyl(g, 0.05, 0.05, 0.008, M.indigo, 0, 0, -0.0844, 48));
    zAxis(cyl(g, 0.0428, 0.0428, 0.0208, M.dark, 0, 0, -0.0908, 48));
    zAxis(cyl(g, 0.057, 0.057, 0.005, M.dark, 0, 0, -0.0989, 56));
    const back = add(g, new THREE.CircleGeometry(0.04, 40), M.black, 0, 0, -0.1015); back.rotation.y = Math.PI;
    zAxis(cyl(g, 0.0045, 0.0045, 0.004, M.lens, 0, 0, -0.1025, 20));
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * Math.PI * 2;
      add(g, new THREE.SphereGeometry(0.0024, 10, 10), glow(0xF5C443), Math.cos(a) * 0.033, Math.sin(a) * 0.033, -0.1022);
    }
    const cone = cyl(g, 0.085, 0.0404, 0.0955, coneMat, 0, 0, -0.149, 56, true);
    cone.rotation.x = -Math.PI / 2;
    add(g, new THREE.TorusGeometry(0.0865, 0.0045, 12, 64), M.black, 0, 0, -0.1969);

    // Antenne Wi-Fi en haut à droite.
    box(g, 0.032, 0.004, 0.022, M.dark, 0.076, 0.0744, -0.0685);
    cyl(g, 0.0032, 0.0032, 0.012, gold, 0.076, 0.0806, -0.0695, 16);
    cyl(g, 0.005, 0.0045, 0.108, M.black, 0.076, 0.1406, -0.0695, 20);

    // Câble d'alimentation (batterie → boîtier).
    const power = new THREE.CatmullRomCurve3([
      new THREE.Vector3(0.105, -0.085, -0.04), new THREE.Vector3(0.09, -0.07, -0.036), new THREE.Vector3(0.082, -0.03, -0.033), new THREE.Vector3(0.069, -0.02, -0.03),
    ]);
    add(g, new THREE.TubeGeometry(power, 30, 0.0018, 8, false), mat(0xB0322A, 0.6));
    return g;
  }

  // ---------- Scène ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputEncoding = THREE.sRGBEncoding;
  stage.prepend(renderer.domElement);
  renderer.domElement.setAttribute("aria-label", "Modèle 3D du matériel BAGUÉ, à faire tourner");
  renderer.domElement.setAttribute("role", "img");

  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xFFFFFF, 0x6F756C, 0.6));
  const sun = new THREE.DirectionalLight(0xFFFFFF, 1.15);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0004;
  scene.add(sun);
  const fill = new THREE.DirectionalLight(0xDCE6F5, 0.35);
  scene.add(fill);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.ShadowMaterial({ opacity: 0.18 }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const camera = new THREE.PerspectiveCamera(32, 1.6, 0.01, 100);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.maxPolarAngle = Math.PI * 0.52;

  const MODELS = {
    poste: { group: buildPoste(), target: new THREE.Vector3(0, 1.3, 0), dist: 4.6, floor: 0, min: 2.2, max: 9, shadow: 2,
      views: { "34": [0.62, 0.22], front: [0, 0.12], back: [Math.PI + 0.55, 0.2] } },
    kit: { group: buildKit(), target: new THREE.Vector3(0, -0.012, -0.075), dist: 0.82, floor: -0.1087, min: 0.4, max: 2.4, shadow: 0.45,
      views: { "34": [0.7, 0.26], front: [0, 0.1], back: [Math.PI - 0.6, 0.22] } },
  };
  Object.values(MODELS).forEach((m) => { m.group.visible = false; scene.add(m.group); });
  let current = null;

  function setView(name) {
    const m = MODELS[current];
    const [az, el] = m.views[name];
    const d = m.dist;
    camera.position.set(m.target.x + d * Math.sin(az) * Math.cos(el), m.target.y + d * Math.sin(el), m.target.z + d * Math.cos(az) * Math.cos(el));
    controls.target.copy(m.target);
    controls.update();
  }
  function show(name) {
    current = name;
    Object.entries(MODELS).forEach(([k, m]) => { m.group.visible = k === name; });
    const m = MODELS[name];
    ground.position.y = m.floor;
    const s = m.shadow;
    sun.position.set(m.target.x + s * 0.9, m.target.y + s * 4.0, m.target.z + s * 1.3);
    sun.target.position.copy(m.target);
    sun.target.updateMatrixWorld();
    Object.assign(sun.shadow.camera, { left: -s, right: s, top: s, bottom: -s, near: 0.01, far: s * 10 });
    sun.shadow.camera.updateProjectionMatrix();
    fill.position.set(m.target.x - s * 2, m.target.y + s, m.target.z - s);
    controls.minDistance = m.min;
    controls.maxDistance = m.max;
    renderInfo(name);
    setView("34");
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  document.getElementById("btn-poste").addEventListener("click", () => show("poste"));
  document.getElementById("btn-kit").addEventListener("click", () => show("kit"));
  document.getElementById("view-34").addEventListener("click", () => setView("34"));
  document.getElementById("view-front").addEventListener("click", () => setView("front"));
  document.getElementById("view-back").addEventListener("click", () => setView("back"));

  // Pour produire les images : window.bagueRender("kit", "back")
  window.bagueRender = (model, view) => { show(model); setView(view); controls.update(); renderer.render(scene, camera); };

  show("poste");
  (function loop() {
    controls.update();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  })();
})();
</script>

</html>
